<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alexandre Beduc</title>
    <link rel="icon" type="image/png" sizes="32x32" href="static/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="static/images/favicon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.g/static.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/style/style.css">
    <link rel="stylesheet" href="static/style/animation.css">
    <script src="static/script/loadHeader.js" defer></script>
    <script src="static/script/loadFooter.js" defer></script>
    <script src="static/script/loadCards.js" defer></script>
    <script src="static/script/switchLanguage.js" defer></script>
    <script src="static/script/switchTheme.js" defer></script>
    <script src="static/script/animationParallax.js" defer></script>
    <script src="static/script/animationHeader.js" defer></script>
    <script src="static/script/animationBannerReveal.js" defer></script>
    <script src="static/script/animationCardReveal.js" defer></script>
    <script src="static/script/submitForm.js" defer></script>
    <script src="static/script/init.js" defer></script>
</head>
<body>

<div class="banner">
    <div class="banner__content">
        <h2 data-translate="index.banner.greeting" class="banner__h2 ml13"></h2>
        <h1 class="banner__h1" data-translate="index.banner.name"></h1>
        <p data-translate="index.banner.information" class="banner__p"></p>
    </div>
    <img src="static/images/down-arrow-5-svgrepo-com.svg" class="banner__arrow" alt="arrow icon pointing down">
</div>

<section id="projects-card-container"
         class="section"
         data-project-keys="chess-log-card, litrevu-card, softdesk-card, eecrm-card"
         data-show-detail-link="true">
</section>

<div>
    <hr class="line-separator">
</div>

<section id="contact" class="section">
    <div class="contact">
        <h1 data-translate="index.form.title" class="contact__title"></h1>
        <p data-translate="index.form.description" class="contact__content"></p>
        <form id="contactForm" class="contact__form" novalidate>
            <div class="contact__form__row">
                <div class="contact__form__group">
                    <label id="first_name_label" for="first_name" data-translate="index.form.labelFirstName"></label>
                    <input type="text" id="first_name" name="first_name">
                </div>
                <div class="contact__form__group">
                    <label id="last_name_label" for="last_name" data-translate="index.form.labelLastName"></label>
                    <input type="text" id="last_name" name="last_name">
                </div>
            </div>
            <div class="contact__form__row">
                <div class="contact__form__group">
                    <label id="email_label" for="email" data-translate="index.form.labelEmail"></label>
                    <input type="email" id="email" name="email">
                </div>
                <div class="contact__form__group">
                    <label id="company_label" for="company" data-translate="index.form.labelCompany"></label>
                    <input type="text" id="company" name="company">
                </div>
            </div>
            <div class="contact__form__row">
                <div class="contact__form__group full-width">
                    <label id="message_label" for="message" data-translate="index.form.labelMessage"></label>
                    <textarea id="message" name="message" placeholder="Type your message here." rows="4"></textarea>
                </div>
            </div>
            <p id="msgBox" class="contact__form__flash contact__form__flash--display"></p>
            <div class="contact__form__row">
                <button id="submitButton"
                        class="contact__form__button"
                        type="submit"
                        data-translate="index.form.button"></button>
            </div>
        </form>
    </div>
</section>
<div>
    <hr class="line-separator">
</div>
</body>
</html>
