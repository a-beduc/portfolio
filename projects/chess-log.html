<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chess Log Tournament</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.g/static.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/style/style.css">
    <script src="../static/script/loadHeader.js" defer></script>
    <script src="../static/script/loadFooter.js" defer></script>
    <script src="../static/script/loadCards.js" defer></script>
    <script src="../static/script/switchLanguage.js" defer></script>
    <script src="../static/script/switchTheme.js" defer></script>
    <script src="../static/script/animationParallax.js" defer></script>
    <script src="../static/script/animationHeader.js" defer></script>
    <script src="../static/script/init.js" defer></script>
</head>
<body>
<main class="main-container">
    <div id="projects-card-container"
         class="project-card project-card--detail"
         data-project-keys="chess-log-card"
         data-show-detail-link="false">
    </div>
    <div class="project-info">
        <h2 class="project-info__title" data-translate="project.chessLogApp.detail.description.title"></h2>
        <hr class="line-separator">
        <p class="project-info__content" >
            <span data-translate="project.chessLogApp.detail.description.content.01"></span>
        <p>
        <p class="project-info__content" >
            <span data-translate="project.chessLogApp.detail.description.content.02" class="bold"></span>
            <span data-translate="project.chessLogApp.detail.description.content.03"></span>
            <span data-translate="project.chessLogApp.detail.description.content.04" class="bold"></span>
            <span data-translate="project.chessLogApp.detail.description.content.05"></span>
            <span data-translate="project.chessLogApp.detail.description.content.06" class="bold"></span>
        </p>
        <div class="project-info__image-block">
            <img src="../assets/chess-log/project_4-2.png" alt="placeholder_text" class="project-info__image-block__image"/>
            <span class="project-info__image-block__description" data-translate="project.chessLogApp.detail.imageText.01"></span>
        </div>
        <div class="project-info__image-block">
            <img src="../assets/chess-log/project_4-3.gif" alt="placeholder_text" class="project-info__image-block__image"/>
            <span class="project-info__image-block__description" data-translate="project.chessLogApp.detail.imageText.02"></span>
        </div>
        <div class="project-info__image-block">
            <img src="../assets/chess-log/project_4-4.png" alt="placeholder_text" class="project-info__image-block__image"/>
            <span class="project-info__image-block__description" data-translate="project.chessLogApp.detail.imageText.03"></span>
        </div>
        <h2 class="project-info__title" data-translate="project.chessLogApp.detail.whatILearned.title"></h2>
        <hr class="line-separator">
        <p class="project-info__content" data-translate="project.chessLogApp.detail.whatILearned.content.01"></p>
        <p class="project-info__content" data-translate="project.chessLogApp.detail.whatILearned.content.02"></p>
        <p class="project-info__content" data-translate="project.chessLogApp.detail.whatILearned.content.03"></p>
        <p class="project-info__content" data-translate="project.chessLogApp.detail.whatILearned.content.04"></p>
    </div>
</main>
<hr class="line-separator">
</body>
